<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren in the Moonmoth Archive — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0910; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Wren in the Moonmoth Archive: a top-down stealth game. Move with WASD, run with Shift, crouch with C, click to throw a pebble distraction. Avoid the wardens' vision cones, collect every star chart, and reach the exit unseen."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
